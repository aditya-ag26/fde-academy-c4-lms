name: Discussions triage

# Two jobs that GitHub cannot do on its own:
#   1. Students (read access) cannot add labels, so the dropdown they pick in the
#      Q&A / Coding Questions / HelpDesk form is turned into a label here.
#   2. Anyone can start a poll in a Poll-format category. Polls are for mentors
#      only, so a poll started by anyone below Maintain is commented on, closed
#      and locked.
# Only reads text from the discussion; it never runs anything from it.

on:
  discussion:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  triage:
    if: github.event.discussion.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const d = context.payload.discussion;
            const slug = d.category.slug;
            const { owner, repo } = context.repo;

            // 1. Polls: mentors only.
            if (slug === 'polls') {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: d.user.login,
              }).catch(() => ({ data: {} }));
              const role = data.role_name || data.permission;
              if (role === 'admin' || role === 'maintain') return;
              await github.graphql(`mutation($id: ID!, $body: String!) {
                addDiscussionComment(input: {discussionId: $id, body: $body}) { clientMutationId }
                closeDiscussion(input: {discussionId: $id, reason: OUTDATED}) { clientMutationId }
                lockLockable(input: {lockableId: $id}) { clientMutationId }
              }`, {
                id: d.node_id,
                body: `Hi @${d.user.login} 👋 Only mentors create polls, so this one has been closed. ` +
                      `You can vote on mentor polls here, and ask questions in **Q&A**, **Coding Questions** or **HelpDesk**.`,
              });
              return;
            }

            // 2. Form answer -> label. Keys are "### Question" headings in the form body.
            const rules = {
              'q-a': ['What is this about?', {
                'An assignment': 'assignment-doubt',
                'A live session or recording': 'session-doubt',
              }],
              'coding-questions': ['What kind of problem is it?', {
                'Setup / installation (tools, environment, packages)': 'setup-issue',
              }],
              'helpdesk': ['What do you need help with?', {
                'Access (LMS, repository, recordings, links)': 'access-issue',
                'Course policy (deadlines, attendance, grading, certificates)': 'course-policy',
              }],
            };
            if (!rules[slug]) return;
            const [heading, map] = rules[slug];
            const esc = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const m = (d.body || '').match(new RegExp(`###\\s*${esc}\\s*\\n+([^\\n]+)`));
            const name = m && map[m[1].trim()];
            if (!name) return;

            const { repository } = await github.graphql(
              `query($owner: String!, $repo: String!, $name: String!) {
                 repository(owner: $owner, name: $repo) { label(name: $name) { id } } }`,
              { owner, repo, name });
            if (!repository.label) {
              core.warning(`Label "${name}" does not exist – run docs/discussions/setup-discussions.sh`);
              return;
            }
            await github.graphql(`mutation($id: ID!, $labels: [ID!]!) {
              addLabelsToLabelable(input: {labelableId: $id, labelIds: $labels}) { clientMutationId }
            }`, { id: d.node_id, labels: [repository.label.id] });
            core.info(`Labelled #${d.number} with ${name}`);
