# Self work & Practice — optional practice, no deadline, nobody assigned to review.
#
# Light on purpose. This category exists to make voluntary work visible, and a long
# form is exactly what stops someone posting it.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Practice you did that nobody asked for

        No deadline, no marks, nobody assigned to reply — though people often do.

        Posting it is worth more than it looks: someone else is stuck on the same
        thing and has not said so.

  - type: input
    id: topic
    attributes:
      label: What is this about?
      description: "A word or two, so it is findable. Retrieval, chunking, SQL…"
      placeholder: chunking
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What did you do?
    validations:
      required: true

  - type: textarea
    id: learned
    attributes:
      label: What surprised you?
      description: >
        Optional, and the most interesting part when there is one. What did you expect
        to happen that did not?
    validations:
      required: false
