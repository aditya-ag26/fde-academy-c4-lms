# Access, tooling, admin. NOT academic.
title: ""
labels: ["type:access", "status:needs-staff"]
body:
  - type: markdown
    attributes:
      value: |
        ## Help Desk

        Access, tooling and admin. For anything academic use **Q&A** or **Doubts** —
        this category is watched by different people.

  - type: dropdown
    id: category
    attributes:
      label: What kind of problem?
      options:
        - "Access — cannot see something I should"
        - "Tooling — something will not install or run"
        - "Admin — deadlines, scheduling, enrolment"
        - "Something else"
    validations:
      required: true

  - type: textarea
    id: blocked
    attributes:
      label: What is blocked?
      description: "What were you trying to do, and what stopped you? Say if there is a deadline involved."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Reinstalled, different browser, asked a peer.
    validations:
      required: false
