# Session-specific doubt.
#
# The three textareas below exist to turn "I don't get it" into something answerable.
# The third one ("what have you tried") is the field that does most of the work.
title: "[S00] "
labels: ["type:doubt", "status:needs-answer"]
body:
  - type: markdown
    attributes:
      value: |
        ## Stuck on something from a session

        Being stuck is not a mark against you. Being silently stuck is the thing to
        avoid.

        Put the session id in the title, like `[S01] cosine similarity`.

  - type: input
    id: session-id
    attributes:
      label: Session id
      description: "Which session, e.g. S01. Checked against batch/sessions/."
      placeholder: S01
    validations:
      required: true

  - type: textarea
    id: understood
    attributes:
      label: What did you understand?
      description: |
        Start from what makes sense. It tells whoever answers where to begin, and it
        usually turns out to be more than you thought.
      placeholder: "I follow that embeddings put similar things near each other, and that cosine measures the angle…"
    validations:
      required: true

  - type: textarea
    id: broke-down
    attributes:
      label: Where did it break down?
      description: "Be as precise as you can. 'At the point where the magnitudes are computed' beats 'the maths'."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: |
        **The field that gets you a good answer.** It stops people suggesting what you
        did twenty minutes ago, and it shows exactly where your model of the problem
        diverges from theirs.
      placeholder: "Re-read the post-read section on cosine. Worked it by hand and got 0.6 instead of 0.975. Checked my magnitudes…"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Code or error output
      description: Paste the actual error, not a description of it.
      render: shell
    validations:
      required: false
