# Coding question solution.
title: "[CQ-000] "
labels: ["type:submission", "status:needs-answer"]
body:
  - type: markdown
    attributes:
      value: |
        ## Posting a coding question solution

        Put the question id in the title, like `[CQ-007] Deduplicate chunks`.

  - type: input
    id: question-id
    attributes:
      label: Question id
      placeholder: CQ-007
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Your approach
      description: "Before the code. How did you think about it? What was the insight, if there was one?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your solution
      description: Paste the code, in a fenced block.
      render: python
    validations:
      required: true

  - type: input
    id: complexity
    attributes:
      label: Complexity
      description: "Time and space, and say if you are unsure — an honest guess is worth more than a confident wrong one."
      placeholder: "O(n log n) time, O(n) space"
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: What did you try that did not work?
      description: "Often the most interesting part of the thread, and the part people learn from."
    validations:
      required: false
