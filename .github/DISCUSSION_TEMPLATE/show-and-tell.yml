# Finished work, projects, wins. Deliberately light.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Show & Tell

        Something you built, something that finally worked, something you found.
        No format requirements — this one is deliberately light.

  - type: textarea
    id: what
    attributes:
      label: What did you build or find?
    validations:
      required: true

  - type: textarea
    id: interesting
    attributes:
      label: What was interesting about it?
      description: "Optional. The surprise, the thing that took three attempts, the bit you are pleased with."
    validations:
      required: false
