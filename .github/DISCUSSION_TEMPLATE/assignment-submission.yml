# Assignment submission — the most important form in the repository.
#
# THE APPROACH FIELD COMES BEFORE THE RESULT. This is deliberate and must not be
# reordered: an approach written after the result is a reconstruction of one, and the
# approach is the part worth reviewing.
#
# Every required field below becomes a label, a routing decision, or a progress signal.
# Students have read access and cannot label anything themselves.
title: "[A00] "
labels: ["type:submission", "status:needs-answer"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submitting an assignment

        Your submission is this thread. The approach, the wrong turn and the
        correction are worth more than the final artefact — which is why this form
        asks for your thinking first.

        **Put the activity id in the title**, like `[A01] Keyword baseline`.

  - type: input
    id: activity-id
    attributes:
      label: Activity id
      description: "The id from the brief, e.g. A01. Checked against activities/briefs/ — a typo here means your submission is not counted."
      placeholder: A01
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      description: Revising after feedback? Say so — it goes in the same thread, not a new one.
      options:
        - "Approach — thinking it through before building (optional, encouraged)"
        - "Submission — this is my work"
        - "Revision — updating after review"
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Your approach
      description: |
        **Before the result, on purpose.** How did you decide to tackle this? What did
        you consider and reject? Where did you expect difficulty?

        Write it as a plan, not a summary. If you are at the Approach stage, this is
        the whole submission — post it and come back.
      placeholder: |
        I started by assuming X, because …
        I considered Y but rejected it since …
        I expect the hard part to be …
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision record (only if the brief asks for one)
      description: |
        Four fields. The last one is the point of the exercise.

        **`would_change_if` must name an OBSERVATION** — something you could go and
        measure. *"If it turns out to be wrong"* is true of every decision ever made
        and is rejected automatically.

        [How to write one](../blob/main/library/templates/decision-record.md)
      value: |
        decision: >-

        why: >-

        rejected: >-

        would_change_if: >-
      render: yaml
    validations:
      required: false

  - type: textarea
    id: result
    attributes:
      label: Your work
      description: |
        Paste your code, or link to a gist or your own repository.

        **Do not open a pull request against this repository** — you have read access
        and submissions belong here in the thread.
      placeholder: |
        https://gist.github.com/...

        or paste directly:

        ```python
        ...
        ```
    validations:
      required: false

  - type: textarea
    id: hard-parts
    attributes:
      label: What was hard, and what would you do differently?
      description: |
        Worth marks, and worth more than that. This is where most of the review value
        is — for you and for whoever reads it next.

        "It went fine" is not an answer. Something was harder than expected.
    validations:
      required: true

  - type: input
    id: reviewed
    attributes:
      label: Whose submission did you review?
      description: "Link the thread you reviewed, if you have been assigned one. Leave blank otherwise."
      placeholder: "#123"
    validations:
      required: false

  - type: checkboxes
    id: honesty
    attributes:
      label: Before you submit
      options:
        - label: "This is my own work. Where I used AI tools or another source, I can explain every part of what I am submitting."
          required: true
        - label: "I have read the rubric."
          required: false
