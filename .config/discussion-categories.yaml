# discussion-categories.yaml — the Discussions layout, as it exists.
#
# ⚠️ CATEGORIES CANNOT BE CREATED OR CONVERTED BY API.
#
# There is no `createDiscussionCategory` mutation in GitHub's GraphQL API and no REST
# equivalent — verified by direct test, not just by reading the docs. Categories are
# created by hand at:
#
#     https://github.com/<owner>/<repo>/discussions/categories
#
# That page is NOT under repository Settings, which is where everyone looks first.
#
# ⚠️ FORMAT IS PERMANENT. A category's format is fixed at creation. An answerable
# category cannot become non-answerable, or the reverse, without deleting it — which
# orphans every thread inside.
#
# This file is the expected state that provision.py verifies against. It describes
# what EXISTS; if you add a category, add it here in the same change.
#
# Source: https://docs.github.com/en/graphql/guides/using-the-graphql-api-for-discussions

version: 2

# Ten categories. Fewer than the twelve originally specified, deliberately: each one
# has to earn its place, and "where does this go" needs one obvious answer.

categories:

  # --- Staff broadcast -------------------------------------------------------
  - name: "Announcements"
    slug: announcements
    emoji: "📣"
    format: DISCUSSION
    description: "Updates from maintainers"
    why_this_format: >
      Kept as GitHub created it. Note this is NOT the restricted ANNOUNCEMENT format —
      anyone can open a thread here. In practice that is fine for a cohort this size,
      and it cannot be changed now without deleting the category.
    posted_by: staff
    automation: >
      notices.yml posts here from batch/notices/. The weekly standup also posts here,
      since there is no separate Weekly Standup category.

  # --- Answerable: the threads that become reference material ---------------
  - name: "Q&A"
    slug: q-a
    emoji: "🙏"
    format: ANSWER
    description: "Ask the community for help"
    why_this_format: >
      ANSWER enables marking a best answer, which is what makes a thread reusable next
      batch and what the FAQ harvest reads.
    posted_by: anyone
    form: q-and-a.yml
    default_labels: ["type:question", "status:needs-answer"]

  - name: "Doubts - Session"
    slug: doubts-session
    emoji: "❓"
    format: ANSWER
    description: >
      Stuck on something from a specific session? Name the session and say what you
      already tried.
    why_this_format: >
      Answerable, and the session id makes it findable by everyone who was in that
      session — which is where the peers most able to answer are.
    posted_by: anyone
    form: doubt.yml
    default_labels: ["type:doubt", "status:needs-answer"]

  - name: "Assignments"
    slug: assignments
    emoji: "📝"
    format: ANSWER
    description: "Hand in your assignments here. One thread per submission — use the form."
    why_this_format: >
      The thread IS the deliverable. ANSWER lets the reviewer's feedback be marked,
      which turns a submission thread into a worked example for the next batch.
    posted_by: anyone
    form: assignment-submission.yml
    default_labels: ["type:submission", "status:needs-answer"]
    automation: "publish-activity.yml posts the brief; discussions-bot.yml acknowledges"

  - name: "Coding Questions"
    slug: coding-questions
    emoji: "💻"
    format: ANSWER
    description: "Solutions to practice problems from library/coding-questions/"
    why_this_format: "Answerable — the best solution gets marked and stays useful."
    posted_by: anyone
    form: coding-question.yml
    default_labels: ["type:submission", "status:needs-answer"]

  - name: "Help Desk"
    slug: help-desk
    emoji: "🛠️"
    format: ANSWER
    description: "Access, tooling and admin problems. Not academic — use Q&A or Doubts for those."
    why_this_format: >
      Answerable because these have a definite resolution. Separate from academic
      questions because different people watch it and the urgency differs — a student
      who cannot log in is fully blocked.
    posted_by: anyone
    form: help-desk.yml
    default_labels: ["type:access", "status:needs-staff"]

  # --- Open-ended: no single right answer ------------------------------------
  - name: "Self work & Practice"
    slug: self-work-practice
    emoji: "🏋️"
    format: DISCUSSION
    description: "Optional practice. No deadline, nobody assigned to review."
    why_this_format: >
      Not answerable, on purpose. Practice has no single right answer, and an unmarked
      answerable thread reads as unresolved — which would make voluntary work look like
      a backlog.
    posted_by: anyone
    default_labels: []

  - name: "Feedback"
    slug: feedback
    emoji: "📊"
    format: DISCUSSION
    description: "About the batch itself — pace, difficulty, content. This is read."
    why_this_format: >
      Feedback is not a question with an answer, and marking one reply as "the answer"
      to a complaint would be the wrong signal entirely.
    posted_by: anyone
    form: feedback.yml
    default_labels: []
    note: >
      The description says plainly that it is read. A feedback channel nobody confirms
      is read gets used twice and then abandoned.

  - name: "General"
    slug: general
    emoji: "💬"
    format: DISCUSSION
    description: "Chat about anything and everything here"
    why_this_format: "GitHub default, kept."
    posted_by: anyone
    default_labels: []
    note: >
      A catch-all becomes where things go to be ignored. Staff should redirect anything
      that has a better home — a question to Q&A, a session doubt to Doubts — rather
      than answering it here, or the specific categories go quiet and this one fills up.

  - name: "Polls"
    slug: polls
    emoji: "🗳️"
    format: POLL
    description: "Take a vote from the community"
    why_this_format: >
      One click is the only feedback mechanism most students will ever use, and a poll
      gets a response rate a thread never will.
    posted_by: staff
    default_labels: []

# --- What is NOT here, and what follows -------------------------------------
not_created:
  - name: "Weekly Standup"
    consequence: >
      The bot posts its weekly standup in Announcements instead. Announcements is not
      the restricted ANNOUNCEMENT format here, so students can also post there — worth
      watching, but not worth deleting and recreating a category over.
  - name: "Show & Tell"
    consequence: "Finished work goes in General or Self work & Practice."
  - name: "Study Group"
    consequence: "Peer coordination goes in General."

# --- Things only a human can do ---------------------------------------------
# None of these have an API. provision.py cannot check or perform them.
manual_only:
  - "Creating or deleting a category"
  - "Changing a category's format"
  - "Setting the default category for new discussions"
  - "Pinning a discussion (pinIssue exists; there is no pinDiscussion)"
  - "Reordering categories in the sidebar"
