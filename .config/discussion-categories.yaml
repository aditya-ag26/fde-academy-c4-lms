# discussion-categories.yaml — the expected Discussions layout.
#
# ⚠️ THESE CANNOT BE CREATED BY API.
#
# There is no `createDiscussionCategory` mutation in the GitHub GraphQL API and no
# REST equivalent. Categories are created BY HAND in:
#
#     Settings → Discussions → Categories → New category
#
# This file is therefore two things:
#   1. the checklist a human works through when provisioning a repository, and
#   2. the expected state that `.github/workflows/provision.yml` VERIFIES against
#      (it queries repository.discussionCategories and reports drift).
#
# ⚠️ FORMAT IS PERMANENT. A category's format is fixed when it is created. An
# ANSWER category cannot later become DISCUSSION, or the reverse, without deleting
# and recreating it — which orphans every thread inside it. Get it right the first
# time; that is why each choice below is justified.
#
# Source: https://docs.github.com/en/graphql/guides/using-the-graphql-api-for-discussions

version: 1

# GitHub allows at most 25 categories per repository. Twelve is deliberate: enough
# that "where does this go" has one obvious answer, few enough that the sidebar is
# readable without scrolling.

categories:

  # --- Staff broadcast -------------------------------------------------------
  - name: "Announcements"
    emoji: "📣"
    format: ANNOUNCEMENT
    description: "Notices, schedule changes, deadline extensions. Staff post; anyone can comment."
    why_this_format: >
      ANNOUNCEMENT restricts who can open a thread to those with write access. A
      notice channel anyone can post in stops being a notice channel.
    posted_by: staff
    automation: ".github/workflows/notices.yml posts here from batch/notices/"

  - name: "Weekly Standup"
    emoji: "🗓️"
    format: ANNOUNCEMENT
    description: "One thread per week: what is on, what is due, what changed."
    why_this_format: >
      Same reason as Announcements. The bot is the author, and a read-only cohort
      needs a heartbeat that nobody has to remember to write.
    posted_by: bot
    automation: ".github/workflows/weekly-standup.yml"

  # --- Answerable: the threads that become reference material ---------------
  - name: "Q&A"
    emoji: "❓"
    format: ANSWER
    description: "Questions not tied to one session."
    why_this_format: >
      ANSWER enables marking a best answer. A marked answer is what makes the
      thread reusable next batch and is what the FAQ harvest reads.
    posted_by: anyone
    form: q-and-a.yml
    default_labels: ["type:question", "status:needs-answer"]

  - name: "Doubts - Session"
    emoji: "🤔"
    format: ANSWER
    description: "Stuck on something from a specific session. Names the session."
    why_this_format: >
      Answerable, and the session id makes it findable by everyone who was in that
      session — which is where the peers most able to answer are.
    posted_by: anyone
    form: doubt.yml
    default_labels: ["type:doubt", "status:needs-answer"]

  - name: "Assignments"
    emoji: "📝"
    format: ANSWER
    description: "Assignment submissions. One thread per submission."
    why_this_format: >
      The thread IS the deliverable. ANSWER lets the reviewer's feedback be marked,
      which turns a submission thread into a worked example for the next batch.
    posted_by: anyone
    form: assignment-submission.yml
    default_labels: ["type:submission", "status:needs-answer"]
    automation: "publish-activity.yml posts the brief thread; discussions-bot.yml acknowledges"

  - name: "Coding Questions"
    emoji: "💻"
    format: ANSWER
    description: "Solutions to practice problems from library/coding-questions/."
    why_this_format: "Answerable — the best solution gets marked and stays useful."
    posted_by: anyone
    form: coding-question.yml
    default_labels: ["type:submission", "status:needs-answer"]

  - name: "Help Desk"
    emoji: "🛠️"
    format: ANSWER
    description: "Access, tooling, admin. NOT academic."
    why_this_format: >
      Answerable because these have a definite resolution. Kept separate from
      academic questions because different people watch it and the urgency differs
      — a student who cannot log in is fully blocked.
    posted_by: anyone
    form: help-desk.yml
    default_labels: ["type:access", "status:needs-staff"]

  # --- Open-ended: no single right answer ------------------------------------
  - name: "Self work & Practice"
    emoji: "🏋️"
    format: DISCUSSION
    description: "Optional practice, no deadline, nobody assigned to review."
    why_this_format: >
      DISCUSSION, not ANSWER. Practice has no single correct answer, and an
      unmarked ANSWER thread reads as unresolved — which would make voluntary work
      look like a backlog.
    posted_by: anyone
    default_labels: []

  - name: "Show & Tell"
    emoji: "🎉"
    format: DISCUSSION
    description: "Finished work, projects, things that finally worked."
    why_this_format: "Nothing to answer. Deliberately the lightest category here."
    posted_by: anyone
    form: show-and-tell.yml
    default_labels: []

  - name: "Study Group"
    emoji: "👥"
    format: DISCUSSION
    description: "Peer coordination — finding people to work with, arranging sessions."
    why_this_format: >
      DISCUSSION, and deliberately staff-light. Students need somewhere that is
      theirs; staff read it but do not run it.
    posted_by: anyone
    default_labels: []

  - name: "Feedback"
    emoji: "📊"
    format: DISCUSSION
    description: "About the batch itself: pace, difficulty, content, logistics."
    why_this_format: >
      DISCUSSION. Feedback is not a question with an answer, and marking one reply
      as 'the answer' to a complaint would be the wrong signal entirely.
    posted_by: anyone
    form: feedback.yml
    default_labels: []
    note: >
      The form states plainly that this is read and by whom. A feedback channel
      nobody confirms is read gets used twice and then abandoned.

  - name: "Polls"
    emoji: "🗳️"
    format: POLL
    description: "Quick pulse checks: pace, topic preference, session timing."
    why_this_format: >
      POLL. One click is the only feedback mechanism most students will ever use,
      and a poll gets a response rate a thread never will.
    posted_by: staff
    default_labels: []

# --- Provisioning checklist ------------------------------------------------
# Worked through once, by a human, in Settings → Discussions.
# Categories are managed at /discussions/categories - NOT under repository Settings,
# which is where everyone looks first.
setup_checklist:
  - "Settings → General → Features → tick Discussions"
  - "Go to /discussions/categories (not Settings - this trips everyone up)"
  - "Delete the defaults you are not keeping (General, Ideas)"
  - "Create each category above: name, emoji, description, FORMAT (permanent)"
  - "Set the default category for new threads to Q&A"
  - "Run .github/workflows/provision.yml to apply labels and verify this list"
  - "Pin the welcome thread and the current Weekly Standup"
  - "Confirm students have READ access only — no triage, no write"
